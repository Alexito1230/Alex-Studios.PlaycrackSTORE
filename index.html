<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Crack Store</title>
    <style>
        :root {
            --primary: #00ffcc;
            --dark: #0a0a0c;
            --card-bg: rgba(20, 20, 25, 0.85);
            --text: #ffffff;
            --text-muted: #8a8a93;
            --error: #ff4a4a;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
        }

        .neon-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
                        linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                        linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
            display: none;
        }

        .store-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 1;
            margin-top: 100px;
            margin-bottom: 40px;
            transition: border-color 0.4s ease;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(8px);
            z-index: 10;
            border-bottom: 1px solid #22222a;
            padding: 10px 0;
        }

        .navbar-content {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 0 20px;
        }

        .search-bar {
            flex: 1;
            padding: 10px;
            background: #1c1c24;
            border: 1px solid #2d2d38;
            border-radius: 8px;
            color: white;
        }

        .nav-btn {
            background: transparent;
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: var(--dark);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        .categories-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .cat-tag {
            background: #1c1c24;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .cat-tag.active {
            background: rgba(0, 255, 204, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .steps-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px solid #2d2d38;
            padding-bottom: 10px;
        }
        .step-tab.active { color: var(--primary); font-weight: bold; }

        .product-card {
            background: rgba(28, 28, 36, 0.9);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2d2d38;
            position: relative;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-new { background: #0077ff; color: white; }
        .badge-refurb { background: #ffaa00; color: black; }
        .badge-used { background: #8a8a93; color: white; }
        .badge-soft { background: #aa00ff; color: white; }

        .price { color: var(--primary); font-weight: bold; font-size: 1.2rem; margin: 8px 0; }
        .old-price { text-decoration: line-through; color: var(--error); font-size: 0.95rem; margin-right: 5px; }

        .btn-box { display: flex; gap: 8px; margin-top: 12px; }
        button {
            flex: 1; background: var(--primary); color: var(--dark); border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .btn-direct { background: white; color: var(--dark); }

        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: var(--text-muted); }
        input, select {
            width: 100%; padding: 10px; background: #1c1c24; border: 1px solid #2d2d38;
            border-radius: 6px; color: white; box-sizing: border-box;
        }
        input.invalid { border-color: var(--error); box-shadow: 0 0 5px var(--error); }

        .model-selector-container {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .model-btn {
            flex: 1;
            background: #1c1c24;
            color: var(--text-muted);
            border: 1px solid #2d2d38;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .model-btn.selected {
            background: rgba(0, 255, 204, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #141419; padding: 24px; border-radius: 12px; border: 1px solid var(--primary);
            width: 90%; max-width: 400px; position: relative;
        }

        .wheel-container { text-align: center; margin: 15px 0; }
        .wheel {
            width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--primary);
            margin: 0 auto; transition: transform 3s ease-out; background: conic-gradient(
                #ff4a4a 0deg 90deg, #0077ff 90deg 180deg, #ffaa00 180deg 270deg, #00ffcc 270deg 360deg
            );
        }

        .chat-bubble {
            position: fixed; bottom: 20px; right: 20px; background: var(--primary);
            color: var(--dark); width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 50;
            font-size: 1.5rem; box-shadow: 0 4px 15px rgba(0,255,204,0.4);
        }
        .chat-window {
            position: fixed; bottom: 80px; right: 20px; width: 300px; height: 350px;
            background: #141419; border: 1px solid var(--primary); border-radius: 12px;
            z-index: 50; display: none; flex-direction: column; overflow: hidden;
        }
        .chat-header { background: var(--primary); color: var(--dark); padding: 10px; font-weight: bold; }
        .chat-body { flex: 1; padding: 10px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 6px 10px; border-radius: 6px; max-width: 80%; }
        .msg.bot { background: #1c1c24; align-self: flex-start; }
        .msg.user { background: var(--primary); color: var(--dark); align-self: flex-end; }
        .chat-footer { padding: 8px; display: flex; gap: 5px; background: #0a0a0c; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="neon-grid" class="neon-grid"></div>

    <!-- Barra de Navegación -->
    <div class="navbar">
        <div class="navbar-content">
            <input type="text" id="search-input" class="search-bar" placeholder="Buscar hardware, juegos..." oninput="filterStore()">
            <button class="nav-btn" onclick="toggleLanguage()" id="lang-btn">EN</button>
            <button class="nav-btn" onclick="toggleTheme()">🌌</button>
            <button class="nav-btn" onclick="openModal('user-modal')">👤</button>
            <button class="nav-btn" onclick="openCartScreen()">🛒<span class="cart-count" id="cart-badge">0</span></button>
        </div>
        <div class="categories-menu">
            <span class="cat-tag active" onclick="filterCategory('all', this)">Todo</span>
            <span class="cat-tag" onclick="filterCategory('new', this)">Novedades</span>
            <span class="cat-tag" onclick="filterCategory('refurbished', this)">Reacondicionadas</span>
            <span class="cat-tag" onclick="filterCategory('used', this)">Usadas</span>
            <span class="cat-tag" onclick="filterCategory('software', this)">Juegos & Ports</span>
        </div>
    </div>
